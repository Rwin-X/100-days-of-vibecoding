<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stoic Formation</title>
<style>
  :root {
    --bg: #f7f5f0;
    --ink: #111111;
    --grid: rgba(17, 17, 17, 0.05);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- background grid ---------- */
  #grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  #grid.show { opacity: 1; }

  .tick {
    position: absolute;
    color: var(--ink);
    opacity: 0;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 400;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  .tick.show { opacity: 0.28; }
  #tick-tl { top: 4vh; left: 4vw; }
  #tick-br { bottom: 4vh; right: 4vw; text-align: right; }

  /* ---------- word ---------- */
  .word {
    position: absolute;
    color: var(--ink);
    font-weight: 300;
    letter-spacing: 0.02em;
    white-space: nowrap;
    opacity: 0;
    will-change: transform, opacity, filter;
    user-select: none;
  }

  .word.drift {
    animation: driftFloat linear infinite;
    filter: blur(0.3px);
  }

  @keyframes driftFloat {
    0%   { transform: translate(var(--dx0), var(--dy0)) rotate(var(--r0)); }
    50%  { transform: translate(var(--dx1), var(--dy1)) rotate(var(--r1)); }
    100% { transform: translate(var(--dx0), var(--dy0)) rotate(var(--r0)); }
  }

  .word.appear {
    animation: fadeIn 1.8s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; filter: blur(6px); }
    to   { opacity: 1; filter: blur(0.3px); }
  }

  .word.settled {
    opacity: 1 !important;
    filter: blur(0) !important;
  }

  #sentence-line {
    position: absolute;
    display: flex;
    flex-wrap: wrap;
    pointer-events: none;
  }

  #sentence-line.layout-centered {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    align-items: baseline;
    justify-content: center;
    max-width: 86vw;
  }

  #sentence-line.layout-left {
    left: 8vw;
    top: 50%;
    transform: translateY(-50%);
    align-items: baseline;
    justify-content: flex-start;
    max-width: 62vw;
  }

  #sentence-line.layout-stacked {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    align-items: baseline;
    justify-content: center;
    max-width: 58vw;
    text-align: center;
  }

  .attribution {
    position: absolute;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%);
    color: var(--ink);
    opacity: 0;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 400;
    transition: opacity 1.2s ease;
  }
  .attribution.layout-left {
    left: 8vw;
    transform: none;
    text-align: left;
  }
  .attribution.show { opacity: 0.45; }

  #restart {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: 1px solid rgba(17,17,17,0.15);
    color: var(--ink);
    opacity: 0;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 18px;
    cursor: pointer;
    transition: opacity 1.2s ease, border-color 0.3s ease, background 0.3s ease;
    font-family: inherit;
  }
  #restart.show { opacity: 0.5; }
  #restart:hover { opacity: 1 !important; border-color: rgba(17,17,17,0.4); }

  #loading {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--ink);
    opacity: 0;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 400;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #loading.show {
    opacity: 0.35;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.45; }
  }

  /* ---------- help / shortcuts overlay ---------- */
  #help-toggle {
    position: absolute;
    bottom: 6vh;
    right: 4vw;
    color: var(--ink);
    opacity: 0.25;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.3s ease;
  }
  #help-toggle:hover { opacity: 0.6; }

  #help-panel {
    position: absolute;
    bottom: 6vh;
    right: 4vw;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(17,17,17,0.1);
    padding: 18px 22px;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    min-width: 200px;
  }
  #help-panel.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #help-panel .row {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    padding: 4px 0;
    opacity: 0.7;
  }
  #help-panel kbd {
    font-family: inherit;
    font-size: 10px;
    border: 1px solid rgba(17,17,17,0.25);
    padding: 1px 6px;
    border-radius: 3px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="grid"></div>
  <div class="tick" id="tick-tl">Stoic Formation</div>
  <div class="tick" id="tick-br">— live —</div>

  <div id="sentence-line" class="layout-centered"></div>
  <div class="attribution" id="attribution"></div>
  <button id="restart">Again</button>
  <div id="loading">Fetching wisdom…</div>

  <button id="help-toggle">?</button>
  <div id="help-panel">
    <div class="row"><span>Next quote</span><kbd>Space</kbd></div>
    <div class="row"><span>Fullscreen</span><kbd>F</kbd></div>
    <div class="row"><span>Grid</span><kbd>G</kbd></div>
    <div class="row"><span>Help</span><kbd>H</kbd></div>
  </div>
</div>

<script>
  // Fallback lines — used ONLY if the live fetch fails (offline / API down / CORS block).
  const FALLBACK_QUOTES = [
    { text: "You have power over your mind, not outside events.", author: "Marcus Aurelius" },
    { text: "We suffer more often in imagination than in reality.", author: "Seneca" },
    { text: "No man is free who is not master of himself.", author: "Epictetus" }
  ];

  const stage = document.getElementById('stage');
  const line = document.getElementById('sentence-line');
  const attribution = document.getElementById('attribution');
  const restartBtn = document.getElementById('restart');
  const loadingEl = document.getElementById('loading');
  const gridEl = document.getElementById('grid');
  const tickTL = document.getElementById('tick-tl');
  const tickBR = document.getElementById('tick-br');
  const helpToggle = document.getElementById('help-toggle');
  const helpPanel = document.getElementById('help-panel');

  let running = false;
  let gridVisible = true;

  const LAYOUTS = ['layout-centered', 'layout-left', 'layout-stacked'];

  async function fetchQuote() {
    try {
      const res = await fetch('https://stoic-quotes.com/api/quote', { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status ' + res.status);
      const data = await res.json();
      if (!data || !data.text || !data.author) throw new Error('malformed response');
      return { text: data.text.trim(), author: data.author.trim() };
    } catch (err) {
      console.warn('Live quote fetch failed, using fallback:', err);
      return FALLBACK_QUOTES[Math.floor(Math.random() * FALLBACK_QUOTES.length)];
    }
  }

  function clearStage() {
    document.querySelectorAll('.word').forEach(w => w.remove());
    line.innerHTML = '';
    line.className = '';
    attribution.classList.remove('show', 'layout-left');
    attribution.textContent = '';
    restartBtn.classList.remove('show');
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  async function run() {
    if (running) return;
    running = true;
    clearStage();

    loadingEl.classList.add('show');
    const quote = await fetchQuote();
    loadingEl.classList.remove('show');

    const words = quote.text.split(' ');

    const layout = pick(LAYOUTS);
    line.classList.add(layout);
    if (layout === 'layout-left') {
      attribution.classList.add('layout-left');
    }

    let baseSize;
    if (layout === 'layout-stacked') {
      baseSize = words.length > 10 ? 34 : 44;
    } else if (layout === 'layout-left') {
      baseSize = words.length > 10 ? 28 : 34;
    } else {
      baseSize = words.length > 10 ? 30 : 38;
    }

    const slotWords = [];
    words.forEach((w, i) => {
      const span = document.createElement('span');
      span.textContent = w + (i < words.length - 1 ? '\u00A0' : '');
      span.style.fontSize = baseSize + 'px';
      span.style.fontWeight = '300';
      span.style.opacity = '0';
      span.style.color = 'var(--ink)';
      line.appendChild(span);
      slotWords.push(span);
    });

    requestAnimationFrame(() => {
      const floaters = [];

      words.forEach((w, i) => {
        const slot = slotWords[i];
        const targetRect = slot.getBoundingClientRect();

        const floater = document.createElement('div');
        floater.className = 'word drift';
        floater.textContent = w;
        floater.style.fontSize = baseSize + 'px';

        const startX = rand(5, 90);
        const startY = rand(8, 85);
        floater.style.left = startX + 'vw';
        floater.style.top = startY + 'vh';

        const dx1 = rand(-18, 18).toFixed(0) + 'px';
        const dy1 = rand(-14, 14).toFixed(0) + 'px';
        const r0 = rand(-2, 2).toFixed(1) + 'deg';
        const r1 = rand(-2, 2).toFixed(1) + 'deg';
        floater.style.setProperty('--dx0', '0px');
        floater.style.setProperty('--dy0', '0px');
        floater.style.setProperty('--dx1', dx1);
        floater.style.setProperty('--dy1', dy1);
        floater.style.setProperty('--r0', r0);
        floater.style.setProperty('--r1', r1);
        floater.style.animationDuration = rand(7, 12).toFixed(1) + 's';
        floater.style.animationDelay = (-rand(0, 8)).toFixed(1) + 's';

        stage.appendChild(floater);
        floaters.push({ el: floater, targetRect });

        setTimeout(() => {
          floater.classList.add('appear');
        }, 90 * i + rand(0, 150));
      });

      const floatDuration = 1400 + words.length * 80;
      const travelTime = 620;
      const pauseBetween = 70;
      const stepGap = travelTime + pauseBetween;

      setTimeout(() => {
        floaters.forEach(({ el, targetRect }, i) => {
          setTimeout(() => {
            el.classList.remove('drift');
            el.style.animation = 'none';
            el.style.transition = `transform ${travelTime}ms cubic-bezier(0.25, 0.1, 0.25, 1), opacity ${travelTime}ms ease, filter ${travelTime}ms ease`;
            el.style.opacity = '0';

            const currentRect = el.getBoundingClientRect();
            const dx = targetRect.left - currentRect.left;
            const dy = targetRect.top - currentRect.top;

            el.style.transform = `translate(${dx}px, ${dy}px) rotate(0deg)`;

            requestAnimationFrame(() => {
              el.style.opacity = '1';
            });

            setTimeout(() => {
              el.classList.add('settled');
            }, travelTime);
          }, i * stepGap);
        });

        const settleTail = (words.length - 1) * stepGap + travelTime + 400;
        setTimeout(() => {
          attribution.textContent = '\u2014 ' + quote.author;
          attribution.classList.add('show');
          restartBtn.classList.add('show');
          running = false;
        }, settleTail);

      }, floatDuration);
    });
  }

  function setGridVisible(visible) {
    gridVisible = visible;
    gridEl.classList.toggle('show', visible);
    tickTL.classList.toggle('show', visible);
    tickBR.classList.toggle('show', visible);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  function toggleHelp() {
    helpPanel.classList.toggle('show');
  }

  helpToggle.addEventListener('click', toggleHelp);

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key.toLowerCase()) {
      case ' ':
        e.preventDefault();
        run();
        break;
      case 'r':
        run();
        break;
      case 'f':
        toggleFullscreen();
        break;
      case 'g':
        setGridVisible(!gridVisible);
        break;
      case 'h':
      case '?':
        toggleHelp();
        break;
    }
  });

  restartBtn.addEventListener('click', run);

  window.addEventListener('load', () => {
    setGridVisible(true);
    run();
  });
</script>

</body>
</html>
